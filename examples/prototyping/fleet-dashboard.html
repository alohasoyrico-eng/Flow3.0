<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Design System Fleet Dashboard Prototype</title>
    <link rel="stylesheet" href="../../packages/components/styles/components.css" />
    <style>
      body {
        background: var(--system-color-surface-raised);
        color: var(--system-color-text);
        font-family: var(--system-font-body);
        margin: 0;
        padding: var(--system-space-xl);
      }

      main {
        display: grid;
        gap: var(--system-space-lg);
        max-width: 960px;
      }

      .dashboard-grid {
        display: grid;
        gap: var(--system-space-lg);
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }
    </style>
  </head>
  <body>
    <main>
      <div id="scope"></div>
      <section class="dashboard-grid" id="fleetCards"></section>
    </main>
    <script src="../../apps/docs/generated/vendor/react.production.min.js"></script>
    <script src="../../apps/docs/generated/vendor/react-dom.production.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "react": "../../apps/docs/generated/vendor/react.esm.js",
          "@design-system/components/platforms": "../../packages/components/src/platforms/index.js"
        }
      }
    </script>
    <script type="module">
      import { createCard } from "../../packages/components/src/index.js";
      import { Button } from "../../packages/react/dist/Button.js";
      import { Select } from "../../packages/react/dist/Select.js";

      function mountButton(props) {
        const host = document.createElement("span");
        ReactDOM.createRoot(host).render(React.createElement(Button, props));
        return host;
      }

      function mountSelect(props) {
        const host = document.createElement("span");
        const root = ReactDOM.createRoot(host);
        let selectedValue = props.value;
        const render = () => {
          root.render(
            React.createElement(Select, {
              ...props,
              value: selectedValue,
              onValueChange(value) {
                selectedValue = value;
                render();
              },
            }),
          );
        };
        render();
        return host;
      }

      const response = await fetch("../../packages/content/content/fixtures/prototyping.json");
      const fixtures = await response.json();
      const scope = document.querySelector("#scope");
      const fleetCards = document.querySelector("#fleetCards");

      scope.append(
        mountSelect({
          label: "Fleet scope",
          helper: "Prototype data from packages/content.",
          options: fixtures.fleets.map((fleet) => ({ label: fleet.label, value: fleet.id })),
          value: "north",
        }),
      );

      for (const fleet of fixtures.fleets) {
        fleetCards.append(
          createCard({
            title: fleet.label,
            value: fleet.weeklySpend,
            detail: `${fleet.vehicles} vehicles. ${fleet.trend}.`,
            status: fleet.risk,
            actions: [
              { label: "Review" },
              { label: "Export", variant: "secondary" },
            ],
          }),
        );
      }

      fleetCards.append(mountButton({ label: "Create report", variant: "secondary" }));
    </script>
  </body>
</html>
