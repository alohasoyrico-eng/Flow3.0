<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Design System Prototype Example</title>
    <link rel="stylesheet" href="../../packages/components/styles/components.css" />
    <style>
      body {
        background: var(--system-color-surface-raised);
        color: var(--system-color-text);
        font-family: var(--system-font-body);
        margin: 0;
        padding: var(--system-space-xl);
      }

      main {
        display: grid;
        gap: var(--system-space-lg);
        max-width: 720px;
      }

      .prototype-actions {
        display: flex;
        flex-wrap: wrap;
        gap: var(--system-space-sm);
      }
    </style>
  </head>
  <body>
    <main id="prototype"></main>
    <script src="../../apps/docs/generated/vendor/react.production.min.js"></script>
    <script src="../../apps/docs/generated/vendor/react-dom.production.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "react": "../../apps/docs/generated/vendor/react.esm.js",
          "@design-system/components/platforms": "../../packages/components/src/platforms/index.js"
        }
      }
    </script>
    <script type="module">
      import { createCard, createSelect, createInput } from "../../packages/components/src/index.js";
      import { Button } from "../../packages/react/dist/Button.js";
      import { IconButton } from "../../packages/react/dist/IconButton.js";

      function mountButton(props) {
        const host = document.createElement("span");
        ReactDOM.createRoot(host).render(React.createElement(Button, props));
        return host;
      }

      function mountIconButton(props) {
        const host = document.createElement("span");
        ReactDOM.createRoot(host).render(React.createElement(IconButton, props));
        return host;
      }

      const response = await fetch("../../packages/content/content/fixtures/prototyping.json");
      const fixtures = await response.json();
      const root = document.querySelector("#prototype");
      const primaryFleet = fixtures.fleets[0];

      root.append(
        createCard({
          title: "Fleet spend",
          value: primaryFleet.weeklySpend,
          detail: primaryFleet.trend,
          status: primaryFleet.risk,
          actions: [
            { label: "Open dashboard" },
            { label: "Export", variant: "secondary" },
          ],
        }),
        createSelect({
          label: "Fleet",
          helper: "Choose the fleet scope for this prototype.",
          options: fixtures.fleets.map((fleet) => ({ label: fleet.label, value: fleet.id })),
          value: primaryFleet.id,
        }),
        createInput({
          label: "Driver",
          helper: "Search by name or vehicle unit.",
          placeholder: fixtures.driverCard.driver,
        }),
      );

      const actions = document.createElement("div");
      actions.className = "prototype-actions";
      actions.append(
        mountButton({ label: "Approve limit" }),
        mountButton({ label: "Decline", variant: "secondary" }),
        mountButton({ label: "Block card", intent: "danger", variant: "danger" }),
        mountIconButton({ label: "Open filters", icon: "tune" }),
      );
      root.append(actions);
    </script>
  </body>
</html>
